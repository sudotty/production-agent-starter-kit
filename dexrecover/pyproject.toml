[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dexrecover"
version = "0.1.0"
description = "Runtime DEX recovery and validation for protected Android APKs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
  "android",
  "apk",
  "dex",
  "art",
  "reverse-engineering",
  "unpacking",
  "frida",
  "jiagu"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]

[project.scripts]
dexrecover = "dexrecover.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dexrecover"]
