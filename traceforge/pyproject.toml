[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traceforge"
version = "0.1.0"
description = "Evidence-driven Android reverse-engineering research harness for authorized security work."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Traceforge contributors" }]
keywords = ["android", "reverse-engineering", "appsec", "frida", "agent", "security-research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]

[project.scripts]
traceforge = "traceforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/traceforge"]

[tool.hatch.build]
include = [
  "src/traceforge/**/*.py",
  "src/traceforge/schema.sql",
]
