# DexRecover bootstrap validation
name: DexRecover CI

on:
  push:
    branches: [dexrecover-bootstrap]
    paths:
      - "dexrecover/**"
      - ".github/workflows/dexrecover-ci.yml"
  pull_request:
    paths:
      - "dexrecover/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dexrecover
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke
        run: dexrecover --help
